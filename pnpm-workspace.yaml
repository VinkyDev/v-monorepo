packages:
  - apps/*
  - packages/*

catalogMode: prefer

# Mastra's bundler loads TypeScript through typescript-paths, which needs
# classic ts.sys. tsgo (catalog TypeScript 7) does not expose it.
catalogs:
  mastra:
    typescript: ^5.9.2

catalog:
  "@types/node": ^24.13.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  oxc-transform-react: ^0.150.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2

  # react
  react: ^19.3.0
  react-dom: ^19.3.0
  "@tanstack/react-query": ^5.103.1
  "@tanstack/react-router": ^1.170.38
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/router-plugin": ^1.168.40

  # ui / styling
  "@shadcn/lint": ^0.1.0
  "@base-ui/react": ^1.8.0
  "@fontsource-variable/noto-sans": ^5.3.0
  "@fontsource-variable/playfair-display": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  class-variance-authority: ^0.7.1
  cn: ^0.3.0
  lucide-react: ^1.46.0
  shadcn: ^4.21.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  zod: ^4.6.5

  # env
  "@t3-oss/env-core": ^0.13.11

  # server
  "@hono/node-server": ^2.1.1
  "@hono/swagger-ui": ^0.6.1
  "@standard-schema/spec": ^1.1.0
  "@hono/vite-dev-server": ^0.26.1
  hono: ^4.13.8
  hono-openapi: ^1.3.3
  oxlint: 1.83.0
  ultracite: ^7.12.0
  knip: ^6.36.0
  es-toolkit: ^1.52.0
  "@mastra/core": ^1.67.0
  "@mastra/editor": ^0.15.0
  "@mastra/mcp": ^1.18.0
  "@mastra/memory": ^1.30.0
  "@mastra/observability": ^1.17.8
  "@mastra/pg": ^1.25.0
  "@mastra/client-js": ^1.46.0
  "@mastra/ai-sdk": ^1.10.3
  mastra: ^1.30.0

  # assistant-ui
  "@assistant-ui/react": ^0.15.20
  "@assistant-ui/ai-sdk": ^0.0.6
  "@assistant-ui/react-markdown": ^0.14.15
  assistant-stream: ^0.3.43

  # desktop
  electron: ^44.4.1
  electron-builder: ^26.16.1
  remark-gfm: ^4.0.1
  tw-shimmer: ^0.4.13
  "@ai-sdk/openai-compatible": ^3.0.51

update:
  ignoreDeps:
    - "@types/node"
overrides:
  vite: "catalog:"
  oxlint: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@google/genai": true
  "@scarf/scarf": false
  core-js-pure: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@shadcn/lint@0.1.0"
  - "@mastra/core@1.67.0"
  - "@mastra/deployer@1.67.0"
  - "@mastra/pg@1.25.0"
  - "@mastra/loggers@1.3.2"
  - "@mastra/mcp@1.18.0"
  - "@mastra/memory@1.30.0"
  - "@mastra/observability@1.17.8"
  - "@mastra/editor@0.15.0"
  - "@mastra/schema-compat@1.3.10"
  - "@mastra/server@1.67.0"
  - mastra@1.30.0
  - typescript@5.9.3
  - "@assistant-ui/react@0.15.20"
  - "@assistant-ui/ai-sdk@0.0.6"
  - "@assistant-ui/react-markdown@0.14.15"
  - "@mastra/client-js@1.46.0"
  - "@mastra/ai-sdk@1.10.3"

packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.1.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9

  # react
  react: ^19.2.8
  react-dom: ^19.2.8
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-router": ^1.170.31
  "@tanstack/react-router-devtools": ^1.167.1
  "@tanstack/router-plugin": ^1.168.34

  # ui / styling
  "@base-ui/react": ^1.7.0
  "@fontsource-variable/noto-sans": ^5.3.0
  "@fontsource-variable/playfair-display": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.33.0
  shadcn: ^4.18.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  zod: ^4.4.3
  es-toolkit: ^1.51.0

  # env
  "@t3-oss/env-core": ^0.13.11

  # logger
  tslog: ^5.1.0

  # server
  "@hono/node-server": ^2.1.1
  "@hono/standard-validator": ^0.4.0
  "@hono/swagger-ui": ^0.6.1
  "@hono/vite-dev-server": ^0.26.1
  hono: ^4.13.3
  hono-openapi: ^1.3.1
  oxlint: 1.79.0
  "@oxlint/plugins": 1.79.0
  "@flue/cli": ^2.0.3
  "@flue/vite": ^2.0.3
  "@flue/runtime": ^2.0.3

  # desktop
  electron: ^43.4.1
  electron-builder: ^26.15.7
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@google/genai": true
  core-js-pure: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - es-toolkit@1.51.0

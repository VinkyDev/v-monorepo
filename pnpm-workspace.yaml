packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^24.13.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  oxc-transform-react: ^0.149.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1

  # react
  react: ^19.3.0
  react-dom: ^19.3.0
  "@tanstack/react-query": ^5.102.8
  "@tanstack/react-router": ^1.170.36
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/router-plugin": ^1.168.38

  # ui / styling
  "@shadcn/lint": ^0.1.0
  "@base-ui/react": ^1.8.0
  "@fontsource-variable/noto-sans": ^5.3.0
  "@fontsource-variable/playfair-display": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  class-variance-authority: ^0.7.1
  cn: ^0.3.0
  lucide-react: ^1.45.0
  shadcn: ^4.21.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  zod: ^4.6.5

  # env
  "@t3-oss/env-core": ^0.13.11

  # logger
  tslog: ^5.2.0

  # server
  "@hono/node-server": ^2.1.1
  "@hono/standard-validator": ^0.4.0
  "@hono/swagger-ui": ^0.6.1
  "@hono/vite-dev-server": ^0.26.1
  hono: ^4.13.7
  hono-openapi: ^1.3.3
  oxlint: 1.82.0
  ultracite: ^7.11.1
  knip: ^6.35.1
  es-toolkit: ^1.52.0
  "@flue/cli": ^2.0.5
  "@flue/vite": ^2.0.5
  "@flue/runtime": ^2.0.5
  "@earendil-works/pi-ai": ^0.85.1

  # desktop
  electron: ^44.3.0
  electron-builder: ^26.16.1

update:
  ignoreDeps:
    - "@types/node"
overrides:
  vite: "catalog:"
  oxlint: "catalog:"
  "@earendil-works/pi-ai": "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@google/genai": true
  core-js-pure: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@shadcn/lint@0.1.0"
